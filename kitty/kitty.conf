#allow_osc_colors no



# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
enable_osc52 yes
enable_ligatures always
font_size 12.0

# END_KITTY_THEME
#
#background_opacity 0.5
#background #000000



# BEGIN_KITTY_FONTS
font_family      family='Iosevka Nerd Font Mono' postscript_name=IosevkaNFM features=-ss01
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
background_opacity 0.9

